  <text x="600" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#58a6ff" opacity="0.700" xml:space="preserve">  \ \  \ \  \ \  \\\  \ \  \       \ \  \ \  \ \  \\\  \ \  \ \  \ \  \\ \  \ \  \|\  \ </text>
  <text x="600" y="171" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#58a6ff" opacity="0.625" xml:space="preserve">   \ \__\ \__\ \_______\ \__\       \ \__\ \__\ \_______\ \__\ \__\ \__\\ \__\ \_______\</text>
  <text x="600" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#58a6ff" opacity="0.550" xml:space="preserve">    \|__|\|__|\|_______|\|__|        \|__|\|__|\|_______|\|__|\|__|\|__| \|__|\|_______|</text>

  <line x1="200" y1="228" x2="1000" y2="228" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <text x="600" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3" filter="url(#glow)">Java Backend Developer</text>
  <text x="600" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#8b949e">Spreadsheet Streaming · Apache Fesod / EasyExcel / Hutool</text>
