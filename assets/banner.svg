<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CodeMan-cmd — Java Backend Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#e6edf3" opacity="0.012"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#scan)"/>

  <!-- 装饰网格 -->
  <g stroke="#30363d" stroke-width="1" opacity="0.16">
    <line x1="0" y1="0" x2="0" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1050" y1="0" x2="1050" y2="320"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="256" x2="1200" y2="256"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- 顶部终端提示条 -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
    <circle cx="30" cy="30" r="6" fill="#ff7b72"/>
    <circle cx="52" cy="30" r="6" fill="#e3b341"/>
    <circle cx="74" cy="30" r="6" fill="#39d353"/>
    <text x="98" y="35" fill="#8b949e">~/CodeMan-cmd — zsh</text>
  </g>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#30363d" stroke-width="1" opacity="0.7"/>

  <text x="600" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#58a6ff" opacity="1.000" xml:space="preserve"> ___  ___  ___  ___  ___          ___  ___  ___  ___  ________  ________   ________     </text>
