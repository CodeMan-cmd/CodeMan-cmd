<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="扫描光标动画">
  <defs>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0969da" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8250df" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </linearGradient>
    <filter id="scanBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- 扫描光束：x 从 60 扫到 1140，再返回；indefinite 反复 -->
  <g filter="url(#scanBlur)">
    <rect x="0" y="60" width="2.5" height="196" fill="url(#scanBeam)">
      <animate attributeName="x" values="60;1140;60" dur="7s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
  </g>

  <!-- 底部进度条：随扫描同步增长 -->
  <rect x="60" y="286" width="1080" height="2" rx="1" fill="#8b949e" opacity="0.35"/>
  <rect x="60" y="286" width="0" height="2" rx="1" fill="#0969da">
    <animate attributeName="width" values="0;1080;0" dur="7s" repeatCount="indefinite" calcMode="spline"
             keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </rect>

  <!-- 状态提示文字：透明度呼吸 -->
  <text x="60" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">
    scanning
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
