<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>蛇 · 大面积观测</title>
<style>body{margin:0;padding:14px;background:#0d1117;color:#e6edf3;font-family:monospace;font-size:12px}
table{border-collapse:collapse;margin-top:8px}td,th{border:1px solid #30363d;padding:3px 9px}
.ok{color:#3fb950}.bad{color:#ff7b72}</style>
</head>
<body>
<p>同时观测 <b>全部 25 个</b>有贡献的格子，采样 8 秒。触发时刻散布在整轮各处，
只要动画在跑就必然抓到变化 —— 避免"只盯几个恰好没到触发点"的误判。</p>
<div id="out">测试中…</div>
<script id="wide">
async function run() {
  const SRC = new URLSearchParams(location.search).get('src') || '/assets/snake.svg';
  const txt = await (await fetch(SRC, { cache: 'no-store' })).text();
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-9999px;top:0';
  host.innerHTML = txt;
  document.body.appendChild(host);
  const svg = host.querySelector('svg');

  const cells = [...svg.getElementsByTagName('rect')].filter((r) => r.getElementsByTagName('animate').length);
  const seen = cells.map(() => new Set());
  const qs = new URLSearchParams(location.search);
  const MAXMS = parseInt(qs.get('ms') || '8000', 10);
  const t0 = performance.now();
  let frames = 0;
  await new Promise((res) => {
    const tick = () => {
      cells.forEach((c, i) => seen[i].add(getComputedStyle(c).fill));
      frames++;
      if (performance.now() - t0 < MAXMS) requestAnimationFrame(tick); else res();
    };
    requestAnimationFrame(tick);
  });
  host.remove();

  const changed = seen.filter((s) => s.size > 1).length;
  // 逐格列出"触发时刻"与是否变化，便于看清分布
  const rows = cells.map((rect, i) => {
    const a = [...rect.getElementsByTagName('animate')].find((x) => x.getAttribute('attributeName') === 'fill');
    const kt = (a.getAttribute('keyTimes') || '').split(';');
    const dur = parseFloat(a.getAttribute('dur'));
    return { at: (parseFloat(kt[1]) * dur).toFixed(1), distinct: seen[i].size };
  }).sort((a, b) => parseFloat(a.at) - parseFloat(b.at));

  const html = rows.map((r) =>
    `<tr><td>${r.at}s</td><td class="${r.distinct > 1 ? 'ok' : 'bad'}">${r.distinct}</td></tr>`
  ).join('');

  document.getElementById('out').innerHTML =
    `<p>源：<b>${SRC}</b> — ${cells.length} 个格子，${frames} 帧，${MAXMS}ms</p>` +
    `<p>颜色发生变化的格子：<b>${changed} / ${cells.length}</b></p>` +
    `<table><tr><th>应触发时刻</th><th>颜色数</th></tr>${html}</table>`;

  window.__WIDE__ = { src: SRC, cells: cells.length, changed, frames, rows };
  console.log('WIDE ' + JSON.stringify(window.__WIDE__));
}
run().catch((e) => { document.getElementById('out').textContent = 'ERR ' + e.message; window.__WIDE__ = { error: e.message }; console.log('WIDE_ERR ' + e.message); });
</script>
</body>
</html>
