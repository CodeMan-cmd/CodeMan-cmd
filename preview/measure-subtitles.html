<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>副标题宽度测量</title></head>
<body style="margin:0;background:#111">
<script id="w">
// 目的：在写进 SVG 之前，先量出每个副标题的渲染宽度，避免卡片里文字被裁掉或出血。
// 之前是"写完 → 渲染 → 发现溢出 → 回头改"，来回好几轮；这里改成先量后写。
const FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif";
const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

const SUBTITLES = [
  '上游已合并 1 · 待审核 8',
  '8 个目前仍 open',
  'Hutool · Fesod · LangChain.js',
  'Hutool 30.3k★ · Fesod 6.2k★',
];
const LABELS = ['提交 PR', '提交 issue', '涉及上游项目', '主项目 star 量级'];

const c = document.createElement('canvas');
const ctx = c.getContext('2d');
const BOX_W = (1000 - 40 * 2 - 14 * 3) / 4;   // 与生成器一致
const AVAIL = BOX_W - 18 - 14;                 // 减左侧内边距与右侧留白

function measure(text, font, size) {
  ctx.font = `${size}px ${font}`;
  return Math.round(ctx.measureText(text).width);
}

console.log('每格可用宽度 =', Math.round(AVAIL), 'px（格宽', Math.round(BOX_W), '）');
console.log('');
for (const size of [10.5, 10, 9.5]) {
  console.log(`── 字号 ${size}px ──`);
  SUBTITLES.forEach((s, i) => {
    const w = measure(s, MONO, size);
    const ok = w <= AVAIL;
    console.log(`  ${ok ? '✔' : '✘'} ${String(w).padStart(4)}px  ${LABELS[i]} → ${s}`);
  });
  console.log('');
}
// 标签行也量一下（13px sans）
console.log('── 标签行 13px sans ──');
LABELS.forEach((s) => {
  const w = measure(s, FONT, 13);
  console.log(`  ${w <= AVAIL ? '✔' : '✘'} ${String(w).padStart(4)}px  ${s}`);
});

window.__W_REPORT__ = { boxW: BOX_W, avail: AVAIL, done: true };
</script>
</body>
</html>
